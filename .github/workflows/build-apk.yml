name: Build debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Unit tests (do not block the APK)
        run: ./gradlew :app:testDebugUnitTest --no-daemon
        continue-on-error: true
      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Report compile errors as a commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -E '^e: |error:|What went wrong|Execution failed' -A3 build.log | head -70; echo '```'; } > err.txt
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$(cat err.txt)"
      - uses: actions/upload-artifact@v4
        with:
          name: solmaz-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
